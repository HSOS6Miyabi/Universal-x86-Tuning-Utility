name: Build and publish UXTU

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uxtu-release
  cancel-in-progress: false

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate automation resources
        shell: pwsh
        run: |
          $root = 'Universal x86 Tuning Utility'
          $xaml = [xml](Get-Content "$root/Views/Pages/Automations.xaml" -Raw)
          $settings = [xml](Get-Content "$root/Properties/Settings.settings" -Raw)
          foreach ($name in @('lockPreset', 'unlockPreset', 'lockCommandString', 'unlockCommandString')) {
            if (-not ($settings.SettingsFile.Settings.Setting | Where-Object { $_.Name -eq $name })) {
              throw "Missing automation setting: $name"
            }
          }
          $requiredTranslations = @(
            'Preset on Workstation Lock',
            'Apply a preset when Windows locks the current session.',
            'Preset on Workstation Unlock',
            'Apply a preset when the current Windows session is unlocked.',
            'Lock Preset Applied!',
            'Unlock Preset Applied!',
            'Your workstation lock preset has been applied.',
            'Your workstation unlock preset has been applied.'
          )
          $catalogues = @(Get-ChildItem -Path "$root/Localization" -Filter '*.json')
          if ($catalogues.Count -ne 21) { throw "Expected 21 supported languages, got $($catalogues.Count)" }
          foreach ($file in $catalogues) {
            $catalogue = Get-Content $file.FullName -Raw | ConvertFrom-Json -AsHashtable
            foreach ($key in $requiredTranslations) {
              if (-not $catalogue.ContainsKey($key) -or [string]::IsNullOrWhiteSpace([string]$catalogue[$key])) {
                throw "Missing automation translation in $($file.Name): $key"
              }
              if ($file.BaseName -ne 'en-GB' -and [string]$catalogue[$key] -ceq $key) {
                throw "Untranslated automation text in $($file.Name): $key"
              }
            }
          }
          $runtime = Get-Content "$root/Services/ApplicationRuntimeService.cs" -Raw
          foreach ($event in @('SystemEvents.SessionSwitch += SessionSwitch;',
                               'SystemEvents.SessionSwitch -= SessionSwitch;',
                               'SessionSwitchReason.SessionLock', 'SessionSwitchReason.SessionUnlock')) {
            if (-not $runtime.Contains($event)) { throw "Missing event handling: $event" }
          }

      - name: Restore AutoOC from the official 26.3.1 portable distribution
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'UXTU-upstream.zip'
          $upstream = Join-Path $env:RUNNER_TEMP 'UXTU-upstream'
          Invoke-WebRequest 'https://github.com/JamesCJ60/Universal-x86-Tuning-Utility/releases/download/26.3.1/Universal.x86.Tuning.Utility.Portable.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $upstream -Force
          $dependency = Get-ChildItem -Path $upstream -Filter 'AutoOC.dll' -File -Recurse | Select-Object -First 1
          if (-not $dependency) { throw 'The official portable package does not contain AutoOC.dll.' }
          Copy-Item -LiteralPath $dependency.FullName -Destination (Join-Path $env:RUNNER_TEMP 'AutoOC.dll')

      - name: Build portable Windows x64 application
        shell: pwsh
        run: |
          $project = 'Universal x86 Tuning Utility/Universal x86 Tuning Utility.csproj'
          $output = Join-Path $env:RUNNER_TEMP 'UXTU-publish'
          $autoOc = Join-Path $env:RUNNER_TEMP 'AutoOC.dll'
          dotnet publish $project --configuration Release --runtime win-x64 --self-contained false "-p:AutoOcPath=$autoOc" --output $output
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }
          foreach ($file in @('Universal x86 Tuning Utility.exe', 'Universal x86 Tuning Utility.dll', 'AutoOC.dll')) {
            if (-not (Test-Path (Join-Path $output $file))) {
              throw "The portable package is missing $file"
            }
          }

      - name: Create portable archive
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'UXTU-publish'
          Compress-Archive -Path "$output/*" -DestinationPath 'Universal.x86.Tuning.Utility.26.3.2.Portable.zip' -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: UXTU-26.3.2-windows-x64
          path: Universal.x86.Tuning.Utility.26.3.2.Portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '26.3.2'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }
          gh release create $tag 'Universal.x86.Tuning.Utility.26.3.2.Portable.zip' --repo '${{ github.repository }}' --target '${{ github.sha }}' --title 'Universal x86 Tuning Utility 26.3.2' --notes @'
          Added presets for Windows workstation lock and unlock events in Automations.
          Session events use SystemEvents.SessionSwitch and apply the selected preset while UXTU is running.
          Includes Chinese localization and a scrollable automation settings page.

          Download the Windows x64 portable ZIP. Requires .NET Desktop Runtime 10 (x64) and PawnIO for supported hardware features.
          '@
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
